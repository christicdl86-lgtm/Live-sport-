<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sport</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #0a0a0a;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #00e676;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 30px; height: 30px;
      background: #00e676;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }

    .logo-text {
      font-size: 19px;
      font-weight: 900;
      color: white;
    }
    .logo-text span { color: #00e676; }

    .live-badge {
      background: #ff0000;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* TABS */
    .tabs {
      display: flex;
      background: #111;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab.active { color: #00e676; border-bottom-color: #00e676; }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">Live<span>Sport</span></div>
  </div>
  <div class="live-badge">● LIVE</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="loadSport('https://m.flashscore.fr/', this)">⚽ Foot</div>
  <div class="tab" onclick="loadSport('https://m.flashscore.fr/basketball/', this)">🏀 Basket</div>
  <div class="tab" onclick="loadSport('https://m.flashscore.fr/tennis/', this)">🎾 Tennis</div>
  <div class="tab" onclick="loadSport('https://m.flashscore.fr/rugby-union/', this)">🏉 Rugby</div>
</div>

<iframe id="sportFrame" src="https://m.flashscore.fr/" allowfullscreen></iframe>

<script>
  function loadSport(url, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('sportFrame').src = url;
  }
</script>

</body>
</html>
